<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">תג מחיר גדול שבנוי מחמש שכבות אבן, כל שכבה בגובה אחר, עם מטבע נחושת שמאיר עליהן</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1620"/><stop offset="0.62" stop-color="#2a2230"/><stop offset="1" stop-color="#3a3040"/></linearGradient>
    <radialGradient id="horizon" cx="50%" cy="66%" r="55%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.42"/><stop offset="0.5" stop-color="#b8582f" stop-opacity="0.14"/><stop offset="1" stop-color="#b8582f" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ecd2ab"/><stop offset="0.55" stop-color="#d6a46c"/><stop offset="1" stop-color="#c9744f"/></radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.55"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></radialGradient>
