<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t">
  <title id="t">נקודת התחלה אחת שמתפצלת לשני מסלולים: שביל ישיר אל שער אחד, ושביל שנפתח לרובע של כמה חללים מקושרים</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1620"/><stop offset="0.62" stop-color="#2a2230"/><stop offset="1" stop-color="#3a3040"/></linearGradient>
    <radialGradient id="horizon" cx="50%" cy="57%" r="52%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.42"/><stop offset="0.5" stop-color="#b8582f" stop-opacity="0.14"/><stop offset="1" stop-color="#b8582f" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ecd2ab"/><stop offset="0.55" stop-color="#d6a46c"/><stop offset="1" stop-color="#c9744f"/></radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.55"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8cab5"/><stop offset="1" stop-color="#f1eadf"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7f0"/><stop offset="1" stop-color="#f1eadf"/></linearGradient>
    <linearGradient id="doorLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd2ab"/><stop offset="0.5" stop-color="#d6a46c"/><stop offset="1" stop-color="#b8582f"/></linearGradient>
    <linearGradient id="doorLightSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd2ab" stop-opacity="0.9"/><stop offset="1" stop-color="#c9744f" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3040"/><stop offset="1" stop-color="#241e23"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#100c12" flood-opacity="0.5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="1080" height="1350"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- night sky with warm horizon -->
    <rect width="1080" height="1350" fill="url(#sky)"/>
    <rect width="1080" height="1350" fill="url(#horizon)"/>
    <g fill="#f1eadf" fill-opacity="0.5">
      <circle cx="120" cy="120" r="1.6"/><circle cx="330" cy="80" r="1.2"/><circle cx="520" cy="170" r="1.4"/><circle cx="700" cy="90" r="1.2"/><circle cx="980" cy="140" r="1.6"/><circle cx="220" cy="300" r="1"/><circle cx="600" cy="330" r="1"/><circle cx="1000" cy="330" r="1.3"/><circle cx="430" cy="430" r="1"/><circle cx="90" cy="520" r="1.2"/>
    </g>
    <!-- copper sun -->
    <circle cx="790" cy="230" r="140" fill="url(#sunGlow)"/>
    <circle cx="790" cy="230" r="66" fill="url(#sun)"/>
    <circle cx="790" cy="230" r="94" fill="none" stroke="#d6a46c" stroke-opacity="0.28"/>
    <circle cx="790" cy="230" r="122" fill="none" stroke="#d6a46c" stroke-opacity="0.14" stroke-dasharray="3 10"/>

    <!-- distant silhouettes for depth -->
    <g fill="#241e23" fill-opacity="0.75">
      <path d="M -20 760 v -90 a 50 50 0 0 1 100 0 v 90 z"/>
      <path d="M 990 760 v -110 a 55 55 0 0 1 110 0 v 110 z"/>
    </g>

    <!-- ground plane -->
    <path d="M -100 760 L 1180 760 L 1180 1350 L -100 1350 Z" fill="url(#ground)"/>
    <path d="M -100 760 L 1180 760 L 1180 772 L -100 772 Z" fill="#c9744f" fill-opacity="0.25"/>

    <!-- ===== the broad side (upper left): a small quarter of connected spaces ===== -->
    <ellipse cx="160" cy="762" rx="70" ry="12" fill="#2a2230" fill-opacity="0.12"/><ellipse cx="330" cy="762" rx="92" ry="14" fill="#2a2230" fill-opacity="0.12"/><ellipse cx="490" cy="762" rx="60" ry="11" fill="#2a2230" fill-opacity="0.12"/>
    <path d="M 540 1170 C 470 1100, 400 1040, 340 980" fill="none" stroke="#fbf7f0" stroke-width="44" stroke-linecap="round"/>
    <path d="M 340 980 C 300 920, 220 850, 160 772" fill="none" stroke="#fbf7f0" stroke-width="30" stroke-linecap="round"/>
    <path d="M 340 980 C 340 920, 332 850, 330 772" fill="none" stroke="#fbf7f0" stroke-width="30" stroke-linecap="round"/>
    <path d="M 340 980 C 400 920, 460 850, 490 772" fill="none" stroke="#fbf7f0" stroke-width="24" stroke-linecap="round"/>
    <path d="M 540 1170 C 470 1100, 400 1040, 340 980" fill="none" stroke="#b8582f" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
    <circle cx="340" cy="980" r="9" fill="#d6a46c"/>
    <!-- low walls / bridges linking the spaces -->
    <g stroke="#3a3040" stroke-width="10" stroke-linecap="round" fill="none" stroke-opacity="0.9">
      <path d="M 205 700 L 265 680"/>
      <path d="M 395 690 L 450 712"/>
    </g>
    <!-- three spaces of different sizes -->
    <g filter="url(#shadow)">
      <path d="M 100 760 v -80 a 60 60 0 0 1 120 0 v 80 z" fill="url(#wall)"/>
      <path d="M 250 760 v -110 a 80 80 0 0 1 160 0 v 110 z" fill="url(#wall)"/>
      <path d="M 440 760 v -60 a 50 50 0 0 1 100 0 v 60 z" fill="url(#wall)"/>
    </g>
    <!-- doorways with warm light -->
    <path d="M 136 760 v -84 a 24 24 0 0 1 48 0 v 84 z" fill="url(#doorLightSoft)"/>
    <path d="M 300 760 v -116 a 30 30 0 0 1 60 0 v 116 z" fill="url(#doorLightSoft)"/>
    <path d="M 472 760 v -66 a 18 18 0 0 1 36 0 v 66 z" fill="url(#doorLightSoft)"/>
    <!-- windows and lanterns -->
    <g fill="#ecd2ab" fill-opacity="0.85">
      <rect x="114" y="668" width="12" height="20" rx="6"/><rect x="194" y="668" width="12" height="20" rx="6"/>
      <rect x="268" y="646" width="14" height="24" rx="7"/><rect x="378" y="646" width="14" height="24" rx="7"/><rect x="323" y="600" width="14" height="14" rx="7"/>
      <rect x="452" y="690" width="10" height="16" rx="5"/><rect x="518" y="690" width="10" height="16" rx="5"/>
    </g>
    <g fill="#d6a46c"><circle cx="160" cy="760" r="6"/><circle cx="330" cy="760" r="7"/><circle cx="490" cy="760" r="5"/></g>
    <g fill="#d6a46c" filter="url(#glow)" fill-opacity="0.6"><circle cx="160" cy="760" r="14"/><circle cx="330" cy="760" r="16"/><circle cx="490" cy="760" r="12"/></g>

    <!-- ===== the focused side (upper right): one straight path, one destination ===== -->
    <path d="M 500 1180 L 580 1180 L 800 764 L 750 764 Z" fill="url(#path)"/>
    <path d="M 540 1165 L 775 772" fill="none" stroke="#b8582f" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
    <!-- the single gate -->
    <g filter="url(#shadow)">
      <path d="M 660 760 v -230 a 115 115 0 0 1 230 0 v 230 z" fill="url(#wall)"/>
    </g>
    <path d="M 700 760 v -170 a 75 75 0 0 1 150 0 v 170 z" fill="url(#doorLight)"/>
    <path d="M 700 760 v -170 a 75 75 0 0 1 150 0 v 170 z" fill="#ecd2ab" fill-opacity="0.35" filter="url(#glow)"/>
    <rect x="650" y="760" width="250" height="10" rx="5" fill="#2a2230" fill-opacity="0.35"/>
    <!-- slim pillars framing the gate -->
    <g fill="#3a3040"><rect x="622" y="620" width="20" height="140" rx="10"/><rect x="908" y="620" width="20" height="140" rx="10"/></g>
    <g fill="#d6a46c"><circle cx="632" cy="612" r="7"/><circle cx="918" cy="612" r="7"/></g>

    <!-- ===== the starting point (bottom) ===== -->
    <ellipse cx="540" cy="1196" rx="150" ry="34" fill="#2a2230" fill-opacity="0.12"/>
    <circle cx="540" cy="1170" r="60" fill="#b8582f"/>
    <circle cx="540" cy="1170" r="60" fill="none" stroke="#d6a46c" stroke-width="3" stroke-opacity="0.9"/>
    <circle cx="540" cy="1170" r="84" fill="none" stroke="#d6a46c" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="540" cy="1170" r="108" fill="none" stroke="#d6a46c" stroke-opacity="0.22" stroke-dasharray="3 10"/>
    <circle cx="540" cy="1170" r="18" fill="#f1eadf"/>
    <circle cx="540" cy="1170" r="8" fill="#2a2230"/>
  </g>
</svg>
