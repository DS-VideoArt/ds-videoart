  <!-- decision line between the two paths -->
  <line x1="540" y1="330" x2="540" y2="1040" stroke="#2a2230" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="540" cy="685" r="18" fill="#f4f0e9" stroke="#b8582f" stroke-width="3"/>
  <circle cx="540" cy="685" r="7" fill="#b8582f"/>

