    <rect width="330" height="34" rx="20" fill="#29242a"/><rect y="20" width="330" height="14" fill="#29242a"/>
    <g fill="#2a2230" fill-opacity="0.25"><rect x="140" y="12" width="34" height="6" rx="3"/><rect x="184" y="12" width="34" height="6" rx="3"/><rect x="228" y="12" width="34" height="6" rx="3"/></g>
