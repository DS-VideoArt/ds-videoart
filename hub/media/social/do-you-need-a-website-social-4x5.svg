    <rect width="330" height="34" rx="20" fill="#29242a"/><rect y="20" width="330" height="14" fill="#29242a"/>
    <g fill="#2a2230" fill-opacity="0.2"><rect x="24" y="58" width="150" height="12" rx="6"/><rect x="24" y="84" width="240" height="8" rx="4"/><rect x="24" y="100" width="210" height="8" rx="4"/></g>
    <g fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.18"><rect x="24" y="132" width="282" height="30" rx="8"/><rect x="24" y="170" width="282" height="30" rx="8"/></g>
    <rect x="24" y="212" width="120" height="26" rx="13" fill="#b8582f"/>
  </g>
  <g transform="translate(180 560) rotate(2)" filter="url(#shadowSm)">
    <rect width="330" height="250" rx="20" fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.12"/>
    <rect width="330" height="34" rx="20" fill="#29242a"/><rect y="20" width="330" height="14" fill="#29242a"/>
    <rect x="24" y="56" width="120" height="12" rx="6" fill="#2a2230" fill-opacity="0.2"/>
    <g fill="#e7dccc"><rect x="24" y="86" width="86" height="64" rx="10"/><rect x="122" y="86" width="86" height="64" rx="10"/><rect x="220" y="86" width="86" height="64" rx="10"/><rect x="24" y="162" width="86" height="64" rx="10"/><rect x="122" y="162" width="86" height="64" rx="10"/></g>
    <rect x="220" y="162" width="86" height="64" rx="10" fill="#d6a46c" fill-opacity="0.85"/>
  </g>
  <g transform="translate(110 250) rotate(-4)" filter="url(#shadowSm)">
