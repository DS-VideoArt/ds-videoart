  </g>
  <rect x="600" y="150" width="400" height="44" rx="24" fill="#29242a"/><rect x="600" y="172" width="400" height="22" fill="#29242a"/>
  <circle cx="632" cy="172" r="6" fill="#b8582f"/><circle cx="654" cy="172" r="6" fill="#d6a46c"/><circle cx="676" cy="172" r="6" fill="#ded4c8"/>
