    <rect x="44" y="80" width="130" height="12" rx="6" fill="#f1eadf" fill-opacity="0.9"/>
    <rect x="44" y="102" width="170" height="8" rx="4" fill="#f1eadf" fill-opacity="0.45"/>
    <rect x="44" y="134" width="84" height="26" rx="13" fill="#b8582f"/>
    <circle cx="262" cy="116" r="30" fill="#d6a46c" fill-opacity="0.9"/>
    <g fill="#e7dccc"><rect x="24" y="192" width="88" height="40" rx="10"/><rect x="121" y="192" width="88" height="40" rx="10"/><rect x="218" y="192" width="88" height="40" rx="10"/></g>
