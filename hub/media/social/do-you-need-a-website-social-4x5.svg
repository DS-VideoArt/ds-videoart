    <use href="#dotrow" y="18"/><use href="#dotrow" y="36"/><use href="#dotrow" y="54"/><use href="#dotrow" y="72"/><use href="#dotrow" y="90"/>
  </g>
  <g fill="#2a2230" fill-opacity="0.14">
