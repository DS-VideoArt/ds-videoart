  <g fill="#e7dccc"><rect x="624" y="438" width="108" height="84" rx="14"/><rect x="746" y="438" width="108" height="84" rx="14"/><rect x="868" y="438" width="108" height="84" rx="14"/></g>
  <g fill="#b8582f" fill-opacity="0.85"><circle cx="650" cy="464" r="8"/><circle cx="772" cy="464" r="8"/><circle cx="894" cy="464" r="8"/></g>
