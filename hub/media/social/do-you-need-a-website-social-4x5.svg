  <g fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.18"><rect x="648" y="982" width="304" height="38" rx="10"/><rect x="648" y="1030" width="304" height="38" rx="10"/><rect x="648" y="1078" width="304" height="38" rx="10"/></g>
  <rect x="648" y="1128" width="304" height="40" rx="20" fill="#b8582f"/>

  <!-- SEVERAL coordinated pages (left column) -->
  <path d="M 410 440 C 440 490, 450 520, 470 560" fill="none" stroke="#d6a46c" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <path d="M 486 804 C 476 826, 460 842, 440 860" fill="none" stroke="#d6a46c" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <circle cx="410" cy="440" r="5" fill="#d6a46c"/><circle cx="470" cy="560" r="5" fill="#d6a46c"/><circle cx="486" cy="804" r="5" fill="#d6a46c"/><circle cx="440" cy="860" r="5" fill="#d6a46c"/>
