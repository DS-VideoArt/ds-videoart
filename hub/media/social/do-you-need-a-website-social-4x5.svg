  <g fill="#d6a46c" fill-opacity="0.9"><circle cx="664" cy="750" r="18"/></g>
  <g fill="#2a2230" fill-opacity="0.2"><rect x="696" y="732" width="180" height="10" rx="5"/><rect x="696" y="754" width="240" height="8" rx="4"/><rect x="696" y="770" width="200" height="8" rx="4"/></g>
  <rect x="624" y="842" width="352" height="2" fill="url(#copperLine)"/>
