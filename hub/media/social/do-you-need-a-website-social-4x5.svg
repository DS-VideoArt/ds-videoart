<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <radialGradient id="glowA" cx="92%" cy="4%" r="60%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.36"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="4%" cy="100%" r="58%"><stop offset="0" stop-color="#b8582f" stop-opacity="0.24"/><stop offset="1" stop-color="#b8582f" stop-opacity="0"/></radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3040"/><stop offset="1" stop-color="#241e23"/></linearGradient>
    <linearGradient id="copperLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6a46c" stop-opacity="0"/><stop offset="0.5" stop-color="#d6a46c"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#2a2230" flood-opacity="0.22"/></filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#2a2230" flood-opacity="0.18"/></filter>
  </defs>

  <!-- warm stone ground -->
  <rect width="1080" height="1350" fill="#f4f0e9"/>
  <rect width="1080" height="1350" fill="url(#glowA)"/>
  <rect width="1080" height="1350" fill="url(#glowB)"/>
  <circle cx="800" cy="690" r="330" fill="none" stroke="#b8582f" stroke-opacity="0.22"/>
  <circle cx="300" cy="640" r="270" fill="none" stroke="#d6a46c" stroke-opacity="0.35"/>
  <g fill="#2a2230" fill-opacity="0.16">
