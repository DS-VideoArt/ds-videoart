<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">דף נחיתה יחיד לעומת אתר תדמית עם כמה עמודים</title>
  <defs>
    <radialGradient id="glowA" cx="88%" cy="6%" r="55%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.34"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="6%" cy="100%" r="52%"><stop offset="0" stop-color="#b8582f" stop-opacity="0.22"/><stop offset="1" stop-color="#b8582f" stop-opacity="0"/></radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3040"/><stop offset="1" stop-color="#241e23"/></linearGradient>
    <linearGradient id="copperLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6a46c" stop-opacity="0"/><stop offset="0.5" stop-color="#d6a46c"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#2a2230" flood-opacity="0.22"/></filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#2a2230" flood-opacity="0.18"/></filter>
    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
    <clipPath id="longPage"><rect x="990" y="92" width="470" height="900" rx="26"/></clipPath>
  </defs>

  <!-- warm stone ground, same language as the site surfaces -->
  <rect width="1600" height="900" fill="#f4f0e9"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
  <g clip-path="url(#frame)">
    <circle cx="1240" cy="470" r="360" fill="none" stroke="#b8582f" stroke-opacity="0.22"/>
    <circle cx="330" cy="430" r="250" fill="none" stroke="#d6a46c" stroke-opacity="0.35"/>
    <g fill="#2a2230" fill-opacity="0.16">
      <g id="dotrow"><circle cx="90" cy="120" r="2"/><circle cx="108" cy="120" r="2"/><circle cx="126" cy="120" r="2"/><circle cx="144" cy="120" r="2"/><circle cx="162" cy="120" r="2"/><circle cx="180" cy="120" r="2"/></g>
      <use href="#dotrow" y="18"/><use href="#dotrow" y="36"/><use href="#dotrow" y="54"/><use href="#dotrow" y="72"/>
    </g>

    <!-- decision line between the two paths -->
    <line x1="800" y1="200" x2="800" y2="700" stroke="#2a2230" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>
    <circle cx="800" cy="450" r="16" fill="#f4f0e9" stroke="#b8582f" stroke-width="3"/>
    <circle cx="800" cy="450" r="6" fill="#b8582f"/>

    <!-- ONE long, focused landing page (starts at the right, runs past the bottom edge) -->
    <g filter="url(#shadow)">
      <rect x="990" y="92" width="470" height="900" rx="26" fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.12"/>
    </g>
    <g clip-path="url(#longPage)">
      <rect x="990" y="92" width="470" height="48" fill="#29242a"/>
      <circle cx="1024" cy="116" r="6" fill="#b8582f"/><circle cx="1046" cy="116" r="6" fill="#d6a46c"/><circle cx="1068" cy="116" r="6" fill="#ded4c8"/>
      <!-- hero block -->
      <rect x="1018" y="168" width="414" height="196" rx="18" fill="url(#dark)"/>
      <rect x="1046" y="204" width="200" height="16" rx="8" fill="#f1eadf" fill-opacity="0.9"/>
      <rect x="1046" y="232" width="260" height="10" rx="5" fill="#f1eadf" fill-opacity="0.45"/>
      <rect x="1046" y="252" width="180" height="10" rx="5" fill="#f1eadf" fill-opacity="0.45"/>
      <rect x="1046" y="296" width="120" height="36" rx="18" fill="#b8582f"/>
      <circle cx="1370" cy="264" r="46" fill="#d6a46c" fill-opacity="0.9"/>
      <!-- three benefit rows -->
      <g fill="#e7dccc">
        <rect x="1018" y="392" width="128" height="88" rx="14"/><rect x="1161" y="392" width="128" height="88" rx="14"/><rect x="1304" y="392" width="128" height="88" rx="14"/>
      </g>
      <g fill="#b8582f" fill-opacity="0.85"><circle cx="1046" cy="418" r="8"/><circle cx="1189" cy="418" r="8"/><circle cx="1332" cy="418" r="8"/></g>
      <g fill="#2a2230" fill-opacity="0.18"><rect x="1036" y="440" width="92" height="8" rx="4"/><rect x="1179" y="440" width="92" height="8" rx="4"/><rect x="1322" y="440" width="92" height="8" rx="4"/><rect x="1036" y="456" width="64" height="8" rx="4"/><rect x="1179" y="456" width="64" height="8" rx="4"/><rect x="1322" y="456" width="64" height="8" rx="4"/></g>
      <!-- copper rule -->
      <rect x="1018" y="512" width="414" height="2" fill="url(#copperLine)"/>
      <!-- text block -->
      <g fill="#2a2230" fill-opacity="0.2"><rect x="1018" y="540" width="240" height="14" rx="7"/><rect x="1018" y="570" width="414" height="9" rx="4"/><rect x="1018" y="590" width="380" height="9" rx="4"/><rect x="1018" y="610" width="330" height="9" rx="4"/></g>
      <!-- form + single call to action, the one goal of the page -->
      <rect x="1018" y="660" width="414" height="260" rx="18" fill="#f1eadf" stroke="#2a2230" stroke-opacity="0.1"/>
      <g fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.18"><rect x="1044" y="690" width="362" height="40" rx="10"/><rect x="1044" y="742" width="362" height="40" rx="10"/><rect x="1044" y="794" width="362" height="40" rx="10"/></g>
      <rect x="1044" y="852" width="362" height="44" rx="22" fill="#b8582f"/>
    </g>

    <!-- the pages are linked: a quiet copper path between them -->
    <path d="M 450 250 C 520 300, 560 320, 610 372" fill="none" stroke="#d6a46c" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
    <path d="M 280 552 C 330 500, 360 470, 400 442" fill="none" stroke="#d6a46c" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
    <circle cx="450" cy="250" r="5" fill="#d6a46c"/><circle cx="610" cy="372" r="5" fill="#d6a46c"/><circle cx="280" cy="552" r="5" fill="#d6a46c"/><circle cx="400" cy="442" r="5" fill="#d6a46c"/>
    <!-- SEVERAL coordinated pages, a business showcase site -->
    <g id="pageC" transform="translate(150 470) rotate(-2)" filter="url(#shadowSm)">
      <rect width="330" height="250" rx="20" fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.12"/>
      <rect width="330" height="34" rx="20" fill="#29242a"/><rect y="20" width="330" height="14" fill="#29242a"/>
      <g fill="#2a2230" fill-opacity="0.2"><rect x="24" y="58" width="150" height="12" rx="6"/><rect x="24" y="84" width="240" height="8" rx="4"/><rect x="24" y="100" width="210" height="8" rx="4"/></g>
      <g fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.18"><rect x="24" y="132" width="282" height="30" rx="8"/><rect x="24" y="170" width="282" height="30" rx="8"/></g>
      <rect x="24" y="212" width="120" height="26" rx="13" fill="#b8582f"/>
    </g>
    <g id="pageB" transform="translate(280 300) rotate(2)" filter="url(#shadowSm)">
      <rect width="330" height="250" rx="20" fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.12"/>
      <rect width="330" height="34" rx="20" fill="#29242a"/><rect y="20" width="330" height="14" fill="#29242a"/>
      <rect x="24" y="56" width="120" height="12" rx="6" fill="#2a2230" fill-opacity="0.2"/>
      <g fill="#e7dccc"><rect x="24" y="86" width="86" height="64" rx="10"/><rect x="122" y="86" width="86" height="64" rx="10"/><rect x="220" y="86" width="86" height="64" rx="10"/><rect x="24" y="162" width="86" height="64" rx="10"/><rect x="122" y="162" width="86" height="64" rx="10"/></g>
      <rect x="220" y="162" width="86" height="64" rx="10" fill="#d6a46c" fill-opacity="0.85"/>
    </g>
    <g id="pageA" transform="translate(120 120) rotate(-4)" filter="url(#shadowSm)">
      <rect width="330" height="250" rx="20" fill="#fdfaf5" stroke="#2a2230" stroke-opacity="0.12"/>
      <rect width="330" height="34" rx="20" fill="#29242a"/><rect y="20" width="330" height="14" fill="#29242a"/>
      <g fill="#2a2230" fill-opacity="0.25"><rect x="140" y="12" width="34" height="6" rx="3"/><rect x="184" y="12" width="34" height="6" rx="3"/><rect x="228" y="12" width="34" height="6" rx="3"/></g>
      <rect x="24" y="56" width="282" height="120" rx="14" fill="url(#dark)"/>
      <rect x="44" y="80" width="130" height="12" rx="6" fill="#f1eadf" fill-opacity="0.9"/>
      <rect x="44" y="102" width="170" height="8" rx="4" fill="#f1eadf" fill-opacity="0.45"/>
      <rect x="44" y="134" width="84" height="26" rx="13" fill="#b8582f"/>
      <circle cx="262" cy="116" r="30" fill="#d6a46c" fill-opacity="0.9"/>
      <g fill="#e7dccc"><rect x="24" y="192" width="88" height="40" rx="10"/><rect x="121" y="192" width="88" height="40" rx="10"/><rect x="218" y="192" width="88" height="40" rx="10"/></g>
    </g>
  </g>
</svg>
