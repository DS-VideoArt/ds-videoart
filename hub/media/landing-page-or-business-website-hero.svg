<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">נקודת התחלה אחת שמתפצלת לשני מסלולים: שביל ישיר אל שער אחד, ושביל שנפתח לרובע של כמה חללים מקושרים</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1620"/><stop offset="0.62" stop-color="#2a2230"/><stop offset="1" stop-color="#3a3040"/></linearGradient>
    <radialGradient id="horizon" cx="50%" cy="66%" r="55%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.42"/><stop offset="0.5" stop-color="#b8582f" stop-opacity="0.14"/><stop offset="1" stop-color="#b8582f" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ecd2ab"/><stop offset="0.55" stop-color="#d6a46c"/><stop offset="1" stop-color="#c9744f"/></radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.55"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8cab5"/><stop offset="1" stop-color="#f1eadf"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7f0"/><stop offset="1" stop-color="#f1eadf"/></linearGradient>
    <linearGradient id="doorLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd2ab"/><stop offset="0.5" stop-color="#d6a46c"/><stop offset="1" stop-color="#b8582f"/></linearGradient>
    <linearGradient id="doorLightSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd2ab" stop-opacity="0.9"/><stop offset="1" stop-color="#c9744f" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3040"/><stop offset="1" stop-color="#241e23"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#100c12" flood-opacity="0.5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- night sky with warm horizon -->
    <rect width="1600" height="900" fill="url(#sky)"/>
    <rect width="1600" height="900" fill="url(#horizon)"/>
    <g fill="#f1eadf" fill-opacity="0.5">
      <circle cx="140" cy="90" r="1.6"/><circle cx="420" cy="60" r="1.2"/><circle cx="690" cy="120" r="1.4"/><circle cx="980" cy="70" r="1.2"/><circle cx="1260" cy="110" r="1.6"/><circle cx="1500" cy="60" r="1.2"/><circle cx="1120" cy="180" r="1"/><circle cx="560" cy="200" r="1"/><circle cx="1400" cy="200" r="1.3"/><circle cx="300" cy="260" r="1"/>
    </g>
    <!-- copper sun -->
    <circle cx="1060" cy="190" r="150" fill="url(#sunGlow)"/>
    <circle cx="1060" cy="190" r="74" fill="url(#sun)"/>
    <circle cx="1060" cy="190" r="104" fill="none" stroke="#d6a46c" stroke-opacity="0.28"/>
    <circle cx="1060" cy="190" r="134" fill="none" stroke="#d6a46c" stroke-opacity="0.14" stroke-dasharray="3 10"/>

    <!-- distant silhouettes for depth -->
    <g fill="#241e23" fill-opacity="0.75">
      <path d="M 60 560 v -120 a 60 60 0 0 1 120 0 v 120 z"/>
      <path d="M 210 560 v -70 a 40 40 0 0 1 80 0 v 70 z"/>
      <path d="M 1440 560 v -140 a 70 70 0 0 1 140 0 v 140 z"/>
    </g>

    <!-- ground plane -->
    <path d="M -100 560 L 1700 560 L 1700 900 L -100 900 Z" fill="url(#ground)"/>
    <path d="M -100 560 L 1700 560 L 1700 574 L -100 574 Z" fill="#c9744f" fill-opacity="0.25"/>

    <!-- ===== the broad, exploratory side (left): a small quarter of connected spaces ===== -->
    <!-- ground connections between spaces -->
    <ellipse cx="290" cy="562" rx="80" ry="12" fill="#2a2230" fill-opacity="0.12"/><ellipse cx="560" cy="562" rx="104" ry="14" fill="#2a2230" fill-opacity="0.12"/><ellipse cx="760" cy="562" rx="70" ry="11" fill="#2a2230" fill-opacity="0.12"/>
    <path d="M 800 790 C 720 760, 660 730, 600 700" fill="none" stroke="#fbf7f0" stroke-width="44" stroke-linecap="round"/>
    <path d="M 600 700 C 520 670, 400 640, 300 580" fill="none" stroke="#fbf7f0" stroke-width="30" stroke-linecap="round"/>
    <path d="M 600 700 C 580 650, 565 610, 560 580" fill="none" stroke="#fbf7f0" stroke-width="30" stroke-linecap="round"/>
    <path d="M 600 700 C 660 660, 720 620, 758 580" fill="none" stroke="#fbf7f0" stroke-width="24" stroke-linecap="round"/>
    <path d="M 800 790 C 720 760, 660 730, 600 700" fill="none" stroke="#b8582f" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
    <circle cx="600" cy="700" r="9" fill="#d6a46c"/>
    <!-- low walls / bridges linking the spaces -->
    <g stroke="#3a3040" stroke-width="10" stroke-linecap="round" fill="none" stroke-opacity="0.9">
      <path d="M 350 500 L 470 470"/>
      <path d="M 610 470 L 700 500"/>
    </g>
    <!-- three spaces of different sizes -->
    <g filter="url(#shadow)">
      <path d="M 220 560 v -150 a 70 70 0 0 1 140 0 v 150 z" fill="url(#wall)"/>
      <path d="M 470 560 v -190 a 90 90 0 0 1 180 0 v 190 z" fill="url(#wall)"/>
      <path d="M 700 560 v -120 a 60 60 0 0 1 120 0 v 120 z" fill="url(#wall)"/>
    </g>
    <!-- doorways with warm light -->
    <path d="M 262 560 v -100 a 28 28 0 0 1 56 0 v 100 z" fill="url(#doorLightSoft)"/>
    <path d="M 527 560 v -130 a 33 33 0 0 1 66 0 v 130 z" fill="url(#doorLightSoft)"/>
    <path d="M 739 560 v -80 a 21 21 0 0 1 42 0 v 80 z" fill="url(#doorLightSoft)"/>
    <!-- windows and lanterns -->
    <g fill="#ecd2ab" fill-opacity="0.85">
      <rect x="236" y="460" width="14" height="22" rx="7"/><rect x="330" y="460" width="14" height="22" rx="7"/>
      <rect x="490" y="440" width="16" height="26" rx="8"/><rect x="614" y="440" width="16" height="26" rx="8"/><rect x="552" y="392" width="16" height="16" rx="8"/>
      <rect x="716" y="480" width="12" height="18" rx="6"/><rect x="792" y="480" width="12" height="18" rx="6"/>
    </g>
    <g fill="#d6a46c"><circle cx="290" cy="560" r="7"/><circle cx="560" cy="560" r="8"/><circle cx="760" cy="560" r="6"/></g>
    <g fill="#d6a46c" filter="url(#glow)" fill-opacity="0.6"><circle cx="290" cy="560" r="16"/><circle cx="560" cy="560" r="18"/><circle cx="760" cy="560" r="14"/></g>

    <!-- ===== the focused side (right): one straight path, one destination ===== -->
    <path d="M 760 810 L 840 810 L 1275 590 L 1225 590 Z" fill="url(#path)"/>
    <path d="M 800 800 L 1250 592" fill="none" stroke="#b8582f" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
    <!-- the single gate -->
    <g filter="url(#shadow)">
      <path d="M 1130 590 v -250 a 120 120 0 0 1 240 0 v 250 z" fill="url(#wall)"/>
    </g>
    <path d="M 1174 590 v -190 a 76 76 0 0 1 152 0 v 190 z" fill="url(#doorLight)"/>
    <path d="M 1174 590 v -190 a 76 76 0 0 1 152 0 v 190 z" fill="#ecd2ab" fill-opacity="0.35" filter="url(#glow)"/>
    <rect x="1120" y="590" width="260" height="10" rx="5" fill="#2a2230" fill-opacity="0.35"/>
    <!-- slim pillars framing the gate -->
    <g fill="#3a3040"><rect x="1088" y="440" width="22" height="150" rx="11"/><rect x="1390" y="440" width="22" height="150" rx="11"/></g>
    <g fill="#d6a46c"><circle cx="1099" cy="432" r="7"/><circle cx="1401" cy="432" r="7"/></g>

    <!-- ===== the starting point ===== -->
    <ellipse cx="800" cy="830" rx="150" ry="34" fill="#2a2230" fill-opacity="0.12"/>
    <circle cx="800" cy="806" r="60" fill="#b8582f"/>
    <circle cx="800" cy="806" r="60" fill="none" stroke="#d6a46c" stroke-width="3" stroke-opacity="0.9"/>
    <circle cx="800" cy="806" r="84" fill="none" stroke="#d6a46c" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="800" cy="806" r="108" fill="none" stroke="#d6a46c" stroke-opacity="0.22" stroke-dasharray="3 10"/>
    <circle cx="800" cy="806" r="18" fill="#f1eadf"/>
    <circle cx="800" cy="806" r="8" fill="#2a2230"/>
  </g>
</svg>
