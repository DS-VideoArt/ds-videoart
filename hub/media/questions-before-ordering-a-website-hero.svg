<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">שני מסמכים עומדים זה ליד זה: הצעת מחיר כהה ומטושטשת עם עיגולים ריקים, ולצידה רשימה בהירה ומסודרת עם סימוני וי בצבע נחושת</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1620"/><stop offset="0.62" stop-color="#2a2230"/><stop offset="1" stop-color="#3a3040"/></linearGradient>
    <radialGradient id="horizon" cx="58%" cy="68%" r="55%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.42"/><stop offset="0.5" stop-color="#b3542c" stop-opacity="0.14"/><stop offset="1" stop-color="#b3542c" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ecd2ab"/><stop offset="0.55" stop-color="#d6a46c"/><stop offset="1" stop-color="#c9744f"/></radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d6a46c" stop-opacity="0.5"/><stop offset="1" stop-color="#d6a46c" stop-opacity="0"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8cab5"/><stop offset="1" stop-color="#f1eadf"/></linearGradient>
    <linearGradient id="vague" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3040"/><stop offset="1" stop-color="#2a2230"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfaf5"/><stop offset="1" stop-color="#ecdfcd"/></linearGradient>
    <radialGradient id="paperGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ecd2ab" stop-opacity="0.55"/><stop offset="1" stop-color="#ecd2ab" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2a2230" stop-opacity="0.38"/><stop offset="1" stop-color="#2a2230" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#horizon)"/>

  <!-- quiet stars -->
  <g fill="#ecd2ab" opacity="0.5">
    <circle cx="140" cy="90" r="1.6"/><circle cx="330" cy="170" r="1.2"/><circle cx="520" cy="70" r="1.4"/><circle cx="700" cy="140" r="1.1"/>
    <circle cx="980" cy="60" r="1.3"/><circle cx="1460" cy="120" r="1.5"/><circle cx="1530" cy="260" r="1.1"/><circle cx="260" cy="300" r="1.2"/>
  </g>

  <!-- copper sun, top left (the reading end in RTL is the right, so the light falls toward the clear page) -->
  <circle cx="300" cy="230" r="190" fill="url(#sunGlow)"/>
  <circle cx="300" cy="230" r="78" fill="url(#sun)"/>
  <circle cx="300" cy="230" r="104" fill="none" stroke="#d6a46c" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- ground -->
  <rect x="0" y="660" width="1600" height="240" fill="url(#ground)"/>
  <rect x="0" y="656" width="1600" height="6" fill="#d6a46c" opacity="0.35"/>

  <!-- shadows -->
  <ellipse cx="610" cy="672" rx="230" ry="20" fill="url(#shadow)"/>
  <ellipse cx="1030" cy="674" rx="250" ry="22" fill="url(#shadow)"/>

  <!-- the vague quote: dark, soft, unanswered -->
  <g transform="rotate(-3 610 440)">
    <rect x="460" y="232" width="300" height="420" rx="18" fill="url(#vague)" stroke="#4d4154" stroke-width="2"/>
    <g filter="url(#soft)" fill="#6a5d70" opacity="0.85">
      <rect x="530" y="284" width="190" height="14" rx="7"/>
      <rect x="500" y="318" width="220" height="10" rx="5" opacity="0.7"/>
      <rect x="560" y="342" width="160" height="10" rx="5" opacity="0.7"/>
      <rect x="580" y="604" width="140" height="16" rx="8"/>
    </g>
    <g fill="none" stroke="#d6a46c" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round">
      <circle cx="704" cy="414" r="18"/>
      <circle cx="704" cy="474" r="18"/>
      <circle cx="704" cy="534" r="18"/>
    </g>
    <g fill="#4d4154">
      <rect x="520" y="406" width="150" height="14" rx="7"/>
      <rect x="550" y="466" width="120" height="14" rx="7"/>
      <rect x="530" y="526" width="140" height="14" rx="7"/>
    </g>
  </g>

  <!-- the clear checklist: light, ordered, every line answered -->
  <circle cx="1030" cy="430" r="330" fill="url(#paperGlow)"/>
  <g transform="rotate(2 1030 430)">
    <rect x="870" y="178" width="320" height="478" rx="20" fill="url(#paper)" stroke="#d6a46c" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="870" y="178" width="320" height="64" rx="20" fill="#2a2230"/>
    <rect x="870" y="214" width="320" height="28" fill="#2a2230"/>
    <circle cx="1150" cy="210" r="9" fill="#d6a46c"/>
    <rect x="910" y="202" width="150" height="14" rx="7" fill="#f1eadf" opacity="0.85"/>
    <g>
      <rect x="1124" y="270" width="34" height="34" rx="8" fill="#b3542c"/>
      <path d="M1132 287l7 7 12-14" fill="none" stroke="#fdfaf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="914" y="276" width="190" height="10" rx="5" fill="#2a2230" opacity="0.72"/>
      <rect x="954" y="294" width="150" height="8" rx="4" fill="#2a2230" opacity="0.32"/>

      <rect x="1124" y="332" width="34" height="34" rx="8" fill="#b3542c"/>
      <path d="M1132 349l7 7 12-14" fill="none" stroke="#fdfaf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="934" y="338" width="170" height="10" rx="5" fill="#2a2230" opacity="0.72"/>
      <rect x="974" y="356" width="130" height="8" rx="4" fill="#2a2230" opacity="0.32"/>

      <rect x="1124" y="394" width="34" height="34" rx="8" fill="#b3542c"/>
      <path d="M1132 411l7 7 12-14" fill="none" stroke="#fdfaf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="914" y="400" width="190" height="10" rx="5" fill="#2a2230" opacity="0.72"/>
      <rect x="964" y="418" width="140" height="8" rx="4" fill="#2a2230" opacity="0.32"/>

      <rect x="1124" y="456" width="34" height="34" rx="8" fill="#b3542c"/>
      <path d="M1132 473l7 7 12-14" fill="none" stroke="#fdfaf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="944" y="462" width="160" height="10" rx="5" fill="#2a2230" opacity="0.72"/>
      <rect x="984" y="480" width="120" height="8" rx="4" fill="#2a2230" opacity="0.32"/>

      <rect x="1124" y="518" width="34" height="34" rx="8" fill="none" stroke="#b3542c" stroke-width="3"/>
      <rect x="924" y="524" width="180" height="10" rx="5" fill="#2a2230" opacity="0.72"/>
      <rect x="974" y="542" width="130" height="8" rx="4" fill="#2a2230" opacity="0.32"/>
    </g>
    <circle cx="930" cy="610" r="26" fill="none" stroke="#d6a46c" stroke-width="3"/>
    <circle cx="930" cy="610" r="12" fill="#d6a46c"/>
  </g>

  <!-- small copper stones on the ground, a quiet echo of the other hub illustrations -->
  <g>
    <rect x="1290" y="612" width="120" height="46" rx="12" fill="#3a3040"/>
    <rect x="1306" y="584" width="88" height="32" rx="10" fill="#4d4154"/>
    <circle cx="1350" cy="658" r="4" fill="#d6a46c"/>
    <rect x="200" y="626" width="96" height="32" rx="10" fill="#3a3040"/>
    <circle cx="248" cy="658" r="4" fill="#d6a46c"/>
  </g>
</svg>
